[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentcast"
version = "0.1.0"
description = "Does sentiment in public text improve forecasts of the S&P 500 and consumer sentiment?"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "requests>=2.32",
    "pyarrow>=16",
    "pyyaml>=6",
    "tqdm>=4.66",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "yfinance>=0.2.50",
    "vaderSentiment>=3.3.2",
    "transformers>=4.44",
    "torch>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["anthropic>=0.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
